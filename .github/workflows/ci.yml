name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  COVERAGE_FLOOR: 95

defaults:
  run:
    working-directory: lumen-dev

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # The canary depends on `../lumen-core` and `../lumen-device` by path, so
      # a bare checkout gets only this repo and every job dies at manifest parse
      # rather than at anything worth reading. Reproduce the sibling layout by
      # hand. Note the checkout paths are the LOWERCASE local names: the
      # manifests resolve `../lumen-core` literally and the runner's filesystem
      # is case-sensitive, so `Lumen-Core` would not be found.
      - uses: actions/checkout@v4
        with:
          path: lumen-dev
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Device
          path: lumen-device
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `defaults.run.working-directory` reaches `run` steps only, never
      # actions, so the cache has to be pointed at the workspace explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  coverage:
    name: coverage >= 95%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen-dev
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Core
          path: lumen-core
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Lumen-Device
          path: lumen-device
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      # --fail-under-lines is the gate. Keep it in CI rather than in a local
      # script: this is the number that decides whether a change is finished.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines ${{ env.COVERAGE_FLOOR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lumen-dev/lcov.info
