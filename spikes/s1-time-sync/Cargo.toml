[package]
name = "s1-time-sync"
description = "Spike S1: does time sync hold under 500 us across ESP32s on ordinary WiFi?"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "s1-time-sync"
path = "src/main.rs"

[dependencies]
esp-hal = { version = "0.23", features = ["esp32c3"] }
# `log` here and on esp-wifi so the driver's own messages come out. Without them
# a failed association is indistinguishable from a hang, which cost an hour.
esp-println = { version = "0.13", default-features = false, features = ["esp32c3", "jtag-serial", "log"] }
log = "0.4"
esp-backtrace = { version = "0.15", features = ["esp32c3", "println", "panic-handler"] }
esp-alloc = "0.6"
# `esp-alloc` is a default feature and must stay on: it provides
# `esp_wifi_allocate_from_internal_ram`, which the driver's C blobs call. Turning
# defaults off without re-adding it links cleanly right up to two undefined
# symbols.
esp-wifi = { version = "0.12", default-features = false, features = [
  "esp32c3", "wifi", "smoltcp", "utils", "esp-alloc", "log",
] }

# Declared here as well as pulled in by esp-wifi, so its features unify. Left to
# esp-wifi alone it arrives with no protocol at all and fails to compile with
# "you must enable at least one of proto-ipv4, proto-ipv6, proto-sixlowpan".
smoltcp = { version = "0.12", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "proto-dhcpv4",
  "socket-udp",
  "socket-dhcpv4",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
